<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI短剧生成器 v2.0 网页版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#0b0e14;color:#e2e4ec;min-height:100vh}
/* ── Header ── */
.header{background:linear-gradient(135deg,#0f1117 0%,#1a1040 100%);border-bottom:1px solid #1e2230;padding:0 1rem}
.header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px}
.header h1{font-size:1.3rem;background:linear-gradient(135deg,#6c5ce7,#00cec9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.header h1 small{font-size:.7rem;color:#6a7090;-webkit-text-fill-color:#6a7090;margin-left:.5rem}
.nav{display:flex;gap:.3rem}
.nav-btn{padding:.5rem 1rem;border-radius:8px;border:1px solid transparent;background:transparent;color:#8a90b0;cursor:pointer;font-size:.85rem;transition:all .2s;position:relative}
.nav-btn:hover{color:#e2e4ec;background:rgba(108,92,231,.1)}
.nav-btn.active{background:rgba(108,92,231,.2);border-color:#6c5ce7;color:#fff}
.nav-badge{position:absolute;top:-4px;right:-4px;background:#e74c3c;color:#fff;font-size:.65rem;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center}
.user-area{display:flex;align-items:center;gap:.5rem}
.user-area input{padding:.4rem .7rem;border-radius:6px;border:1px solid #2a2e40;background:#0b0e14;color:#e2e4ec;font-size:.82rem;width:100px;outline:none}
.user-area input:focus{border-color:#6c5ce7}
.user-area .avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#6c5ce7,#00cec9);display:flex;align-items:center;justify-content:center;font-size:.8rem;color:#fff;flex-shrink:0}
/* ── Layout ── */
.container{max-width:1200px;margin:0 auto;padding:1.5rem 1rem}
.page{display:none}
.page.active{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
/* ── Cards ── */
.card{background:#141822;border:1px solid #1e2230;border-radius:12px;padding:1.5rem;margin-bottom:1rem}
.card-title{color:#00cec9;font-size:1rem;margin-bottom:.8rem;display:flex;align-items:center;gap:.5rem}
.card-title .num{background:#6c5ce7;color:#fff;border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;flex-shrink:0}
label{display:block;color:#8a90b0;font-size:.85rem;margin-bottom:.3rem}
select,input,textarea{width:100%;padding:.6rem .8rem;border-radius:8px;border:1px solid #2a2e40;background:#0b0e14;color:#e2e4ec;font-size:.9rem;outline:none;transition:border .2s;font-family:inherit}
select:focus,input:focus,textarea:focus{border-color:#6c5ce7}
select option{background:#141822}
textarea{resize:vertical;min-height:60px}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.6rem 1.3rem;border-radius:8px;border:none;font-size:.85rem;cursor:pointer;transition:all .2s;font-weight:500}
.btn-primary{background:linear-gradient(135deg,#6c5ce7,#00cec9);color:#fff}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-secondary{background:#1e2230;color:#aab0d0;border:1px solid #2a2e40}
.btn-secondary:hover{background:#2a2e40}
.btn-ghost{background:transparent;color:#6a7090;padding:.4rem .8rem;font-size:.8rem}
.btn-ghost:hover{color:#e2e4ec}
.btn-sm{padding:.35rem .7rem;font-size:.78rem}
.btn-danger{background:#3d1a1a;color:#e74c3c;border:1px solid #5a2020}
.btn-danger:hover{background:#5a2020}
.flex{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.mt1{margin-top:1rem}
.mb1{margin-bottom:1rem}
.mr1{margin-right:.5rem}
.hidden{display:none!important}
/* ── Category Grid ── */
.grid-cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.4rem}
.cat-btn,.style-btn{padding:.5rem;border-radius:8px;border:1px solid #2a2e40;background:transparent;color:#aab0d0;cursor:pointer;font-size:.82rem;text-align:center;transition:all .2s}
.cat-btn:hover,.style-btn:hover{border-color:#6c5ce7;color:#e2e4ec}
.cat-btn.selected,.style-btn.selected{background:rgba(108,92,231,.25);border-color:#6c5ce7;color:#fff}
.sub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.4rem;margin-top:.5rem}
.sub-btn{padding:.4rem .6rem;border-radius:6px;border:1px solid #2a2e40;background:transparent;color:#8a90b0;cursor:pointer;font-size:.78rem;text-align:center;transition:all .2s}
.sub-btn:hover,.sub-btn.selected{border-color:#00cec9;color:#00cec9;background:rgba(0,206,201,.1)}
/* ── Spinner ── */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #2a2e40;border-top-color:#00cec9;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:.4rem}
@keyframes spin{to{transform:rotate(360deg)}}
/* ── Toast ── */
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:#141822;border:1px solid #6c5ce7;border-radius:8px;padding:.7rem 1.3rem;font-size:.85rem;z-index:999;animation:fadeIn .3s;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.toast.error{border-color:#e74c3c}
.toast.success{border-color:#00cec9}
/* ── Progress ── */
.progress{display:flex;gap:.3rem;justify-content:center;margin-bottom:1.5rem}
.prog-dot{width:10px;height:10px;border-radius:50%;background:#1e2230;transition:all .3s}
.prog-dot.done{background:#6c5ce7}
.prog-dot.active{background:#00cec9;box-shadow:0 0 8px rgba(0,206,201,.5)}
/* ── Result ── */
.result-section{background:#141822;border:1px solid #1e2230;border-radius:12px;padding:1.2rem;margin-bottom:1rem}
.result-section h3{color:#00cec9;font-size:1rem;margin-bottom:.5rem}
.result-section .story-text{background:#0b0e14;border-radius:8px;padding:1rem;font-size:.88rem;line-height:1.9;overflow-x:auto;white-space:pre-wrap;color:#c4c8d8;max-height:500px;overflow-y:auto}
.episode-title{padding:.6rem;background:#1e2230;border-radius:6px;cursor:pointer;margin:.3rem 0;font-size:.85rem;display:flex;justify-content:space-between}
.episode-title:hover{background:#2a2e40}
.episode-body{display:none;padding:.8rem;background:#0b0e14;border-radius:6px;margin:.3rem 0;font-size:.85rem;line-height:1.9;max-height:600px;overflow-y:auto;white-space:pre-wrap}
/* ── Gallery ── */
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}
.gallery-card{background:#141822;border:1px solid #1e2230;border-radius:12px;padding:1.2rem;cursor:pointer;transition:all .2s}
.gallery-card:hover{border-color:#6c5ce7;transform:translateY(-2px);box-shadow:0 4px 20px rgba(108,92,231,.15)}
.gallery-card h3{color:#e2e4ec;font-size:1rem;margin-bottom:.3rem}
.gallery-card .meta{color:#6a7090;font-size:.78rem;margin-bottom:.5rem}
.gallery-card .tags{display:flex;gap:.3rem;flex-wrap:wrap}
.gallery-card .tag{display:inline-block;background:rgba(108,92,231,.15);color:#a5b4fc;padding:.1rem .4rem;border-radius:4px;font-size:.7rem}
.gallery-empty{padding:3rem 1rem;text-align:center;color:#6a7090;font-size:.9rem}
/* ── Diff Highlight ── */
.diff-changed{background:rgba(255,193,7,.2);border-radius:4px;padding:.2rem .1rem}
.diff-count{color:#ffc107;font-size:.78rem;margin-bottom:.5rem}
/* ── Draft ── */
.draft-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}
.draft-card{background:#141822;border:1px solid #1e2230;border-radius:12px;padding:1.2rem;cursor:default;transition:all .2s;border-left:3px solid #e67e22}
.draft-card h3{color:#e2e4ec;font-size:1rem;margin-bottom:.3rem}
.draft-card .meta{color:#6a7090;font-size:.78rem;margin-bottom:.5rem}
.draft-card .tags{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.8rem}
.draft-card .tag{display:inline-block;background:rgba(108,92,231,.15);color:#a5b4fc;padding:.1rem .4rem;border-radius:4px;font-size:.7rem}
.draft-card .tag.optimized{background:rgba(255,193,7,.15);color:#ffc107}
.draft-actions{display:flex;gap:.4rem;flex-wrap:wrap}
.draft-badge{display:inline-block;background:#e67e22;color:#fff;padding:.1rem .5rem;border-radius:4px;font-size:.7rem;margin-left:.4rem}
/* ── Detail View ── */
.detail-header{margin-bottom:1.5rem}
.detail-header h2{font-size:1.4rem;color:#e2e4ec;margin-bottom:.3rem}
.detail-header .meta{color:#6a7090;font-size:.82rem}
.detail-section{background:#141822;border:1px solid #1e2230;border-radius:12px;padding:1.2rem;margin-bottom:1rem}
.detail-section h3{color:#00cec9;font-size:.95rem;margin-bottom:.5rem;border-left:3px solid #6c5ce7;padding-left:.6rem}
.detail-section .content{font-size:.88rem;line-height:1.8;white-space:pre-wrap;color:#c4c8d8}
.detail-ep-toggle{padding:.5rem;background:#1e2230;border-radius:6px;cursor:pointer;margin:.2rem 0;font-size:.83rem;display:flex;justify-content:space-between;color:#aab0d0}
.detail-ep-toggle:hover{background:#2a2e40}
.detail-ep-body{display:none;padding:.8rem;background:#0b0e14;border-radius:6px;margin:.2rem 0;font-size:.85rem;line-height:1.9;max-height:500px;overflow-y:auto;white-space:pre-wrap}
/* ── Comments ── */
.comment-box{margin-top:1rem}
.comment-input-area{display:flex;gap:.5rem;margin-bottom:.8rem}
.comment-input-area textarea{flex:1;min-height:50px;font-size:.82rem;padding:.5rem}
.comment-item{padding:.6rem 0;border-bottom:1px solid #1e2230}
.comment-item:last-child{border-bottom:none}
.comment-user{color:#a5b4fc;font-size:.8rem;font-weight:500}
.comment-time{color:#6a7090;font-size:.72rem;margin-left:.5rem}
.comment-text{color:#c4c8d8;font-size:.83rem;margin-top:.2rem;line-height:1.5}
.comment-empty{color:#6a7090;font-size:.82rem;padding:.5rem 0}
/* ── Modal ── */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:1000;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s}
.modal-box{background:#141822;border:1px solid #2a2e40;border-radius:16px;padding:1.5rem;max-width:500px;width:90%;max-height:80vh;overflow-y:auto}
.modal-box h2{color:#e2e4ec;font-size:1rem;margin-bottom:1rem}
.modal-actions{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem}
/* ── Scrollbar ── */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#0b0e14}
::-webkit-scrollbar-thumb{background:#2a2e40;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#3a3e50}
@media(max-width:640px){
  .header-inner{flex-wrap:wrap;height:auto;padding:.5rem 0;gap:.5rem}
  .grid-cat{grid-template-columns:repeat(3,1fr)}
  .gallery-grid{grid-template-columns:1fr}
  .nav-btn{padding:.35rem .6rem;font-size:.78rem}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <h1>AI 短剧生成器 <small>v2.0 网页版</small></h1>
    <div class="nav">
      <button class="nav-btn active" onclick="switchPage('gallery')">作品集</button>
      <button class="nav-btn" onclick="switchPage('generator')">新建剧本</button>
      <button class="nav-btn" id="nav-drafts" onclick="switchPage('drafts')">草稿箱<span class="nav-badge" id="draft-badge" style="display:none">0</span></button>
      <button class="nav-btn" onclick="showDataModal()">💾 数据</button>
    </div>
    <div class="user-area">
      <input id="username-input" placeholder="输入用户名" value="" maxlength="20"
             oninput="saveUsername()" onfocus="this.select()">
      <div class="avatar" id="avatar-display">?</div>
    </div>
  </div>
</div>

<div class="container">
  <!-- ══ 作品集 ══ -->
  <div id="page-gallery" class="page active">
    <div class="flex" style="margin-bottom:1rem;justify-content:space-between">
      <h2 style="font-size:1.1rem;color:#e2e4ec">公开作品集</h2>
      <button class="btn btn-sm btn-secondary" onclick="loadGallery()">🔄 刷新</button>
    </div>
    <div id="gallery-list" class="gallery-grid">
      <div class="gallery-empty">加载中...</div>
    </div>
  </div>

  <!-- ══ 详情视图 ══ -->
  <div id="page-detail" class="page">
    <button class="btn btn-ghost mb1" onclick="backToGallery()">← 返回作品集</button>
    <div id="detail-content"></div>
  </div>

  <!-- ══ 生成器 ══ -->
  <div id="page-generator" class="page">
    <div class="progress" id="progress-bar"></div>
    <div id="step-container"></div>
    <div id="result-area" class="hidden"></div>
  </div>

  <!-- ══ 草稿箱 ══ -->
  <div id="page-drafts" class="page">
    <div class="flex" style="margin-bottom:1rem;justify-content:space-between">
      <h2 style="font-size:1.1rem;color:#e2e4ec">📋 我的草稿箱</h2>
      <button class="btn btn-sm btn-secondary" onclick="loadDrafts()">🔄 刷新</button>
    </div>
    <div id="draft-list" class="draft-grid">
      <div class="gallery-empty">加载中...</div>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════
// 数据
// ══════════════════════════════════════════════════════════
const CATEGORIES = [
  {main:"玄幻", subs:["东方玄幻","异世大陆","王朝争霸","高武世界"]},
  {main:"奇幻", subs:["现代魔法","剑与魔法","史诗奇幻","神秘幻想"]},
  {main:"武侠", subs:["传统武侠","武侠幻想","国术无双"]},
  {main:"仙侠", subs:["修真文明","幻想修仙","现代修真","神话修真"]},
  {main:"都市", subs:["爱情婚姻","都市生活","都市异能","异术超能","青春校园","娱乐明星"]},
  {main:"现实", subs:["时代叙事","家庭伦理","女性题材","青年故事","社会悬疑","人间百态"]},
  {main:"军事", subs:["军旅生涯","军事战争","战争幻想","抗战烽火","谍战特工"]},
  {main:"历史", subs:["架空历史","秦汉三国","两晋隋唐","两宋元明","清史民国","外国历史"]},
  {main:"游戏", subs:["电子竞技","虚拟网游","游戏异界","游戏主播"]},
  {main:"体育", subs:["篮球运动","体育赛事","足球运动"]},
  {main:"科幻", subs:["古武机甲","未来世界","星际文明","超级科技","时空穿梭","进化变异","末世危机"]},
  {main:"诸天无限", subs:["无限","诸天","综漫"]},
  {main:"悬疑灵异", subs:["诡异神秘","规则怪谈","侦探推理","灵异民俗","惊悚微恐"]},
  {main:"轻小说", subs:["原生幻想","衍生同人","搞笑吐槽"]}
];
const STYLES = [
  {num:"1",name:"极致爽",feat:"低阻力快反击无憋屈"},
  {num:"2",name:"高智商博弈",feat:"权谋算计势均力敌"},
  {num:"3",name:"跌宕逆袭",feat:"先抑后扬前期憋屈"},
  {num:"4",name:"种田发育",feat:"低调发育稳步变强"},
  {num:"5",name:"惊险高压",feat:"全程高压步步惊险"},
  {num:"6",name:"轻松日常",feat:"无冲突纯解压"},
  {num:"7",name:"现实虐心",feat:"无金手指写实扎心"},
  {num:"8",name:"热血竞技",feat:"公平对抗团队热血"},
  {num:"9",name:"宏大宿命",feat:"身负宿命史诗格局"}
];

// ══════════════════════════════════════════════════════════
// 状态
// ══════════════════════════════════════════════════════════
let state = {
  step: 0,
  mainCat: '', subCat: '', style: '', protagCfg: '1',
  theme: '', episodes: 10, golden: '', camera: '',
  apiKey: '', apiBase: 'https://api.deepseek.com/v1',
  isRealistic: false
};
const steps = ['api','category','subcategory','style','protagonist','theme','episodes','golden','camera','done'];

// ── 用户名 ──
function getUsername(){
  return document.getElementById('username-input').value.trim() || '匿名观众';
}
function saveUsername(){
  const name = document.getElementById('username-input').value.trim();
  const av = document.getElementById('avatar-display');
  av.textContent = name ? name.charAt(0).toUpperCase() : '?';
  try{localStorage.setItem('drama_username', name);}catch(e){}
}
function loadUsername(){
  try{
    const saved = localStorage.getItem('drama_username');
    if(saved){ document.getElementById('username-input').value = saved; saveUsername(); }
  }catch(e){}
}

// ── 页面切换 ──
function switchPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  const el = document.getElementById('page-'+name);
  if(el) el.classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>{
    var label = b.textContent.replace(/\d+/g,'').trim();
    if(name==='gallery' && label.startsWith('作品集')) b.classList.add('active');
    else if(name==='generator' && label.startsWith('新建')) b.classList.add('active');
    else if(name==='drafts' && label.startsWith('草稿箱')) b.classList.add('active');
  });
  if(name==='gallery') loadGallery();
  if(name==='drafts') loadDrafts();
}

// ══════════════════════════════════════════════════════════
// 作品集
// ══════════════════════════════════════════════════════════
async function loadGallery(){
  const list = document.getElementById('gallery-list');
  list.innerHTML = '<div class="gallery-empty">⏳ 加载中...</div>';
  try{
    var data = getAllScripts();
    if(!data || data.length===0){
      list.innerHTML = '<div class="gallery-empty">📭 还没有人发布作品，去「新建剧本」生成一个吧！</div>';
      return;
    }
    list.innerHTML = '';
    data.forEach(s=>{
      const card = document.createElement('div');
      card.className = 'gallery-card';
      card.onclick = ()=>openDetail(s.id);
      card.innerHTML = `
        <h3>${escHtml(s.title||'未命名')}</h3>
        <div class="meta">👤 ${escHtml(s.username||'匿名')} · ${s.created||''}</div>
        <div class="tags">
          <span class="tag">${escHtml(s.mainCat||'')}</span>
          <span class="tag">${escHtml(s.subCat||'')}</span>
          <span class="tag">${escHtml(s.style||'')}</span>
          <span class="tag">📺 ${s.episodes||0}集</span>
          <span class="tag">💬 ${s.commentCount||0}</span>
        </div>`;
      list.appendChild(card);
    });
  }catch(e){
    list.innerHTML = `<div class="gallery-empty">❌ 加载失败: ${escHtml(e.message)}</div>`;
  }
}

// ══════════════════════════════════════════════════════════
// 详情页
// ══════════════════════════════════════════════════════════
async function openDetail(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-detail').classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  const cont = document.getElementById('detail-content');
  cont.innerHTML = '<div style="text-align:center;padding:2rem;color:#6a7090">⏳ 加载中...</div>';
  try{
    var s = getScriptById(id);
    if(!s) throw new Error('剧本不存在');
    renderDetail(s);
  }catch(e){
    cont.innerHTML = `<div style="text-align:center;padding:2rem;color:#e74c3c">❌ ${escHtml(e.message)}</div>`;
  }
}

function renderDetail(s){
  const cont = document.getElementById('detail-content');
  let epHtml = '';
  const eps = s.episodes_data || [];
  eps.forEach((ep,i)=>{
    epHtml += `<div class="detail-ep-toggle" onclick="toggleDetailEp(this)">
      <span>第 ${ep.num||(i+1)} 集</span><span style="color:#6a7090">点击展开 ▸</span>
    </div>
    <div class="detail-ep-body">${escHtml(ep.content||'')}</div>`;
  });

  // 分镜提示词（和分集故事一样格式）
  let shotsHtml = '';
  const shots = s.shots_data || [];
  if(shots.length > 0){
    // 尝试解析 episodes 格式
    var shotEpisodes = null;
    if(typeof shots === 'object' && shots.episodes && Array.isArray(shots.episodes)){
      shotEpisodes = shots.episodes;
    } else if(Array.isArray(shots)){
      // 可能是 [{num:1, content:...}, ...] 或每集json
      if(shots.length > 0 && shots[0].content){
        shotEpisodes = shots;
      } else if(shots.length > 0 && typeof shots[0] === 'object' && !shots[0].content){
        shotEpisodes = null; // 复杂结构，跳过
      }
    }
    if(shotEpisodes && shotEpisodes.length > 0){
      var shotHtml = '';
      shotEpisodes.forEach(function(se, idx){
        var content = se.content || (se.shots ? JSON.stringify(se.shots, null, 2) : JSON.stringify(se, null, 2));
        shotHtml += '<div class="detail-ep-toggle" onclick="toggleDetailEp(this)">' +
          '<span>第 '+(se.episodeNum||se.num||(idx+1))+' 集 · 分镜</span><span style="color:#6a7090">点击展开 ▸</span>' +
        '</div>' +
        '<div class="detail-ep-body">' + escHtml(content) + '</div>';
      });
      shotsHtml = '<div class="detail-section"><h3>🎬 时间轴分镜提示词（'+shotEpisodes.length+'集）</h3>' + shotHtml + '</div>';
    } else if(Array.isArray(shots)){
      // 纯文本分镜
      shotsHtml = '<div class="detail-section"><h3>🎬 时间轴分镜提示词</h3><div class="content">' + escHtml(shots.map(function(s){return typeof s==='string' ? s : JSON.stringify(s);}).join('\n\n---\n\n')) + '</div></div>';
    } else {
      shotsHtml = '<div class="detail-section"><h3>🎬 时间轴分镜提示词</h3><div class="content">' + escHtml(JSON.stringify(shots, null, 2)) + '</div></div>';
    }
  }

  // 评论
  let commentHtml = '<div class="comment-box" id="comment-area">';
  const comments = s.comments || [];
  if(comments.length===0){
    commentHtml += '<div class="comment-empty">暂无评论</div>';

    comments.forEach(c=>{
      commentHtml += `<div class="comment-item">
        <span class="comment-user">${escHtml(c.username||'匿名')}</span>
        <span class="comment-time">${c.time||''}</span>
        <div class="comment-text">${escHtml(c.content)}</div>
      </div>`;
    });
  }
  commentHtml += `<div class="comment-input-area">
    <textarea id="comment-input" placeholder="写下你的评论..." rows="1"></textarea>
    <button class="btn btn-sm btn-primary" onclick="submitComment('${s.id}')">发送</button>
  </div></div>`;

  cont.innerHTML = `
    <div class="detail-header">
      <h2>${escHtml(s.title||'未命名')}</h2>
      <div class="meta">👤 ${escHtml(s.username||'匿名')} · ${s.created||''}
        · ${escHtml(s.mainCat||'')} → ${escHtml(s.subCat||'')}
        · ${escHtml(s.style||'')} · 📺 ${s.episodes||0}集</div>
    </div>
    <div class="detail-section">
      <h3>角色设定</h3>
      <div class="content">${escHtml(s.characters||'')}</div>
    </div>
    <div class="detail-section">

}

function toggleDetailEp(el){
  const body = el.nextElementSibling;
  if(!body || !body.classList.contains('detail-ep-body')) return;
  const d = body.style.display;

async function submitComment(scriptId){
  const input = document.getElementById('comment-input');
  const content = input.value.trim();
  if(!content){ toast('请输入评论内容'); return; }
  const username = getUsername();
  try{
    var comment = {
      id: genId(),
      username: username,
      content: content,
      time: new Date().toLocaleString('zh-CN')
    };
    addComment(scriptId, comment);
    input.value = '';
    toast('评论已发布', 'success');
    openDetail(scriptId);
  }catch(e){

}

function render(){
  document.getElementById('step-container').innerHTML = renderStep(state.step);
  renderProgress();
}
function renderProgress(){
  const bar = document.getElementById('progress-bar');
  bar.innerHTML = '';
  for(let i=0;i<steps.length-1;i++){
    const dot = document.createElement('div');
    dot.className = 'prog-dot' + (i<state.step?' done':'') + (i===state.step?' active':'');
    bar.appendChild(dot);
  }
}
function goTo(s){ state.step = s; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function next(){
  if(state.step < steps.length-1){ state.step++; render(); window.scrollTo({top:0,behavior:'smooth'}); }
}

function renderStep(s){
  switch(s){
    case 0: return stepAPI();
    case 1: return stepCategory();
    case 2: return stepSubCategory();
    case 3: return stepStyle();
    case 4: return stepProtagonist();
    case 5: return stepTheme();
    case 6: return stepEpisodes();
    case 7: return stepGolden();
    case 8: return stepCamera();
    case 9: return stepDone();
    default: return '';
  }
}

var DATA_KEY = 'standalone_scripts';

function getAllScripts(){
  try{ return JSON.parse(localStorage.getItem(DATA_KEY)||'[]'); }catch(e){ return []; }
}

function saveAllScripts(data){
  try{ localStorage.setItem(DATA_KEY, JSON.stringify(data)); }catch(e){}
}

function getScriptById(id){
  var list = getAllScripts();
  for(var i=0;i<list.length;i++){ if(list[i].id===id) return list[i]; }
  return null;
}

function addScript(script){
  var list = getAllScripts();
  list.unshift(script);
  saveAllScripts(list);
  return script;
}

function updateScript(id, updates){
  var list = getAllScripts();
  for(var i=0;i<list.length;i++){
    if(list[i].id===id){
      for(var k in updates) list[i][k]=updates[k];
      break;
    }
  }
  saveAllScripts(list);
}

function deleteScript(id){
  var list = getAllScripts();
  list = list.filter(function(s){ return s.id!==id; });
  saveAllScripts(list);
}

function addComment(scriptId, comment){
  var list = getAllScripts();
  for(var i=0;i<list.length;i++){
    if(list[i].id===scriptId){
      if(!list[i].comments) list[i].comments=[];
      list[i].comments.push(comment);
      break;
    }
  }
  saveAllScripts(list);
}

function downloadStartupScript(){

// ══════════════════════════════════════════════════════════
// API 调用
// ══════════════════════════════════════════════════════════
async function callAPI(messages, system, temp=0.85, maxTokens=2000){
  if(!state.apiKey) throw new Error('请先输入 API Key');
  const body = {model:'deepseek-chat', messages:[], temperature:temp, max_tokens:maxTokens};
  if(system) body.messages.push({role:'system', content:system});
  body.messages.push(...messages);

  // 修正 API URL
  var baseUrl = state.apiBase.replace(/\/+$/,'');
  // 如果用户填了 /v1 去掉，DeepSeek 不需要
  baseUrl = baseUrl.replace(/\/v1$/,'');
  const apiUrl = baseUrl + '/chat/completions';

  // 清理 API Key：去除非 ASCII 字符（避免复制时带入零宽空格等不可见字符）
  var cleanKey = state.apiKey.trim().replace(/[^\x20-\x7E]/g,'');
  if(!cleanKey) throw new Error('API Key 无效，请重新输入（注意不要有多余空格或特殊字符）');

  for(let attempt=0; attempt<3; attempt++){
    try{
      const res = await fetch(apiUrl, {
        method:'POST',
        headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+cleanKey},
        body:JSON.stringify(body)
      });
      if(!res.ok){
        const e=await res.text();
        throw new Error('API HTTP '+res.status+(e?' - '+e.slice(0,300):''));
      }
      // 检查返回类型
      const ctype = (res.headers.get('content-type')||'').toLowerCase();
      if(!ctype.includes('application/json') && !ctype.includes('text/json')){
        const text = await res.text();
        throw new Error('API 返回了非 JSON 内容（URL可能不对），请检查 API 地址是否正确。返回内容开头: '+text.slice(0,80));
      }
      const data = await res.json();
      if(!data.choices || !data.choices[0]){
        throw new Error('API 返回格式异常: ' + JSON.stringify(data).slice(0,200));
      }
      return data.choices[0].message.content.trim();
    }catch(e){
      // 捕获非 Latin-1 字符导致的 fetch 错误
      if(e.message && e.message.indexOf('non ISO-8859-1') !== -1){
        throw new Error('API Key 包含非法字符，请重新输入（只允许英文字母、数字和符号）');
      }
      // 检测到 file:// 协议下的网络错误，弹出修复提示
      if(window.location.protocol === 'file:' && (e.message.indexOf('fetch') !== -1 || e.message.indexOf('network') !== -1 || e.message.indexOf('NetworkError') !== -1)){
        checkFileProtocol();
        throw new Error('⚠️ 当前页面通过 file:// 协议打开，浏览器禁止了网络请求。请用 Safari 打开或下载启动脚本解决（已弹出提示）');
      }
      if(attempt<2 && !e.message.includes('非 JSON')){
        await new Promise(r=>setTimeout(r,2000*(attempt+1)));
        continue;
      }
      throw e;
    }
  }
}

// ── 干净文本处理 ──
function cleanMd(text){
  return text.replace(/\*\*([^*]+)\*\*/g,'$1').replace(/#+\s*/g,'').replace(/__([^_]+)__/g,'$1')
             .replace(/~~(.+?)~~/g,'$1').replace(/`([^`]+)`/g,'$1').trim();
}

// 深度清理：去除 AI 的确认/解释性前缀 + 双星号/井号等标记
function cleanShotText(text){
  if(!text) return '';
  var cleaned = text;
  // 去除 AI 常见确认前缀（好的/明白/确认/已收到/严格遵守 等开头段）
  cleaned = cleaned.replace(/^(好的[，,。]?|好[的，,]|明白[了，,]?|确认[。，]?|已收到[。，]?|收到[。，]?|以下是我|以下是根据|根据要求|遵照指令|严格遵循|如您所愿|现在开始|直接输出).*?(角色名册|故事原文|输出格式|分镜\d)/si, '$2');
  cleaned = cleaned.replace(/^(好的[，,。!！]*\s*指令[已确].*?(?:分镜|画面|镜头))/si, '');
  cleaned = cleaned.replace(/^(好的[，,。]*\s*[^。\n]{0,80}?[。！]?)\n{1,2}(?=分镜)/s, '');
  // 去掉末尾的额外解释
  cleaned = cleaned.replace(/\n{2,}(以上|以上就是|如需|如果您|希望|请问|注：|注意).*/s, '');
  // 去掉 markdown 标记
  cleaned = cleaned.replace(/\*\*/g,'').replace(/##+\s*/g,'').replace(/__/g,'').replace(/~~/g,'').replace(/`/g,'');
  // 去掉多余空行
  cleaned = cleaned.replace(/\n{3,}/g,'\n\n').trim();
  return cleaned;
}

function formatStory(text){
  text = cleanMd(text);
  text = text.replace(/\n{3,}/g,'\n\n');
  let lines = text.split('\n').map(l=>l.trim());
  let result = [];
  for(let line of lines){
    if(!line){ result.push(''); continue; }
    if('。！？，；：、"\''.includes(line.slice(-1)) || line.endsWith('...')){
      result.push(line);
    } else if(line.length>60){
      let parts = line.split(/(?<=[。！？])/);
      for(let p of parts){ p=p.trim(); if(p) result.push(p); }
    } else {
      result.push(line);
    }
  }
  return result.join('\n');
}

function extractNames(charText){
  var names = { hero:'', hero2:'', villain:'', heroine:'', all:[] };
  var lines = (charText||'').split('\n');
  for(var i=0;i<lines.length;i++){
    var l = lines[i].trim();
    if(l.indexOf('主角姓名')!==-1) names.hero = l.split(/[：:]/).pop().trim();
    else if(l.indexOf('主角1姓名')!==-1) names.hero = l.split(/[：:]/).pop().trim();
    else if(l.indexOf('主角2姓名')!==-1) names.hero2 = l.split(/[：:]/).pop().trim();
    else if(l.indexOf('反派姓名')!==-1) names.villain = l.split(/[：:]/).pop().trim();
    else if(l.indexOf('女主角姓名')!==-1) names.heroine = l.split(/[：:]/).pop().trim();
    if(l.indexOf('姓名')!==-1 || l.indexOf('名字')!==-1){
      var nameVal = l.split(/[：:]/).pop().trim().split(/[\/\s]/)[0];
      if(nameVal && nameVal.length>=2) names.all.push(nameVal);
    }
  }
  // 去重
  names.all = names.all.filter(function(v,i,self){return self.indexOf(v)===i;});
  return names;
}

// 从提取的角色名构建【锁定角色名册】字符串 — 后续所有步骤强制使用
function buildLockedNames(namesObj){
  var parts = [];
  if(namesObj.hero) parts.push('【主角】'+namesObj.hero);
  if(namesObj.hero2) parts.push('【主角2】'+namesObj.hero2);
  if(namesObj.villain) parts.push('【反派】'+namesObj.villain);
  if(namesObj.heroine) parts.push('【女主角】'+namesObj.heroine);
  // 也包含自动捕获的其他角色名
  for(var i=0;i<namesObj.all.length;i++){
    var n = namesObj.all[i];
    if(n!==namesObj.hero && n!==namesObj.hero2 && n!==namesObj.villain && n!==namesObj.heroine){
      parts.push('【其他】'+n);
    }
  }
  if(parts.length===0) return '（未提取到角色名）';
  return '╔══════════════════════════════════════════════════════╗\n║            【全局锁定角色名册 — 严禁修改】            ║\n║  以下角色名是本剧本唯一允许使用的姓名。              ║\n║  后续所有步骤（大纲、每集、分镜）必须严格使用这些     ║\n║  姓名，绝对禁止创建任何新角色名或修改已有角色名。     ║\n║  若AI在输出中创建了新名字，将被判定为严重违规。      ║\n╚══════════════════════════════════════════════════════╝\n' + parts.join('\n');
}

  // 提取优化建议（分析文本中【优化建议】后面的内容）

  if(idx !== -1){

  }

  // 构建精简版完整剧本（每集只发摘要，减小 token 消耗）
  var episodeSummary = generatedResult.episodes.map(function(e){
    var preview = (e.content||'').slice(0,150).replace(/\n/g,' ');
    return '第'+e.num+'集（共'+(e.content||'').length+'字）：'+preview+'...';

  var optPrompt = '你是一个专业短剧优化师。以下是当前剧本和优化建议。\n\n';

  // 自动重试函数（最多2次）
  async function tryOptimize(retries){
    for(var r=0; r<=retries; r++){
      try{
        var raw = await callAPI([{role:'user',content:optPrompt}], '你是一个专业短剧优化师。严格输出合法JSON。注意转义。不要markdown。', 0.7, 32768);
        raw = raw.replace(/^```json\s*/,'').replace(/\s*```$/,'').trim();

  try{

  if(!optData) throw new Error('AI返回格式异常');

  // 合并优化结果 + 原版未修改部分
  optimizedResult = {

    }),

    if(!optData || !optData.episodes) throw new Error('AI返回格式异常');

    };
    var drafts = getDrafts();
    drafts.unshift(draft);
    saveDraftsToStorage(drafts);

    // ── 显示优化摘要 + 高亮对比 ──
    var changeCount = optimizedResult.changes.length;
    var html = '<div class="result-section" style="border-color:#ffc107">';

    html += '<p style="color:#6a7090;font-size:.82rem;margin-bottom:.8rem">原版已自动保存到草稿箱，可随时查看</p>';

      html += optimizedResult.changes.map(function(c){ return escHtml(c.section)+'（'+escHtml(c.reason)+'）'; }).join('；');
      html += '</div>';
    }

    // 高亮对比 - 剧情大纲
    var outlineDiff = computeDiff(generatedResult.outline, optimizedResult.outline);

    // 高亮对比 - 分集

// ── 安全的JSON解析（自动修复常见格式问题） ──
function safeJSONParse(text){
  if(!text) throw new Error('JSON为空');
  var cleaned = text.trim();
  // 检测是否被截断（未闭合的 { } [ ] 或字符串）
  var opens = (cleaned.match(/\{/g)||[]).length;
  var closes = (cleaned.match(/\}/g)||[]).length;
  var quoteCount = (cleaned.match(/"/g)||[]).length;
  if(opens !== closes || quoteCount % 2 !== 0){
    throw new Error('AI 输出不完整（JSON结构未闭合），可能是内容过长被截断，请重试或减少剧本规模');
  }
  // 尝试直接解析
  try { return JSON.parse(cleaned); } catch(e){}
  // 如果包裹了markdown代码块
  cleaned = cleaned.replace(/^```(?:json)?\s*/,'').replace(/\s*```$/,'').trim();
  try { return JSON.parse(cleaned); } catch(e){}
  // 尝试修复常见问题：字符串里未转义的换行
  cleaned = cleaned.replace(/\n(?=(?:[^"]*"[^"]*")*[^"]*$)/g,'\\n');
  cleaned = cleaned.replace(/\t(?=(?:[^"]*"[^"]*")*[^"]*$)/g,'\\t');
  try { return JSON.parse(cleaned); } catch(e){}
  // 尝试修复未转义的双引号
  var fixed = '';
  var inStr = false;
  for(var ci=0; ci<cleaned.length; ci++){
    var ch = cleaned[ci];
    var prev = ci>0 ? cleaned[ci-1] : '';
    if(ch === '"' && prev !== '\\'){
      inStr = !inStr;
      fixed += ch;
    } else if(ch === '\n' && inStr){
      fixed += '\\n';
    } else if(ch === '\t' && inStr){
      fixed += '\\t';
    } else {
      fixed += ch;
    }
  }
  try { return JSON.parse(fixed); } catch(e){}
  // 最终：提取第一个 { 到最后一个 } 之间的内容
  cleaned = text.replace(/```(?:json)?/g,'').trim();
  var start = cleaned.indexOf('{');
  var end = cleaned.lastIndexOf('}');
  if(start !== -1 && end > start){
    cleaned = cleaned.substring(start, end+1);
    try { return JSON.parse(cleaned); } catch(e){}
  }
  throw new Error('JSON格式异常，无法自动修复：'+cleaned.slice(0,300));
}

// ── 文本对比 → 高亮HTML ──
function computeDiff(oldText, newText){
  if(oldText === newText) return escHtml(newText);
  var oldLines = (oldText||'').split('\n').filter(Boolean);
  var newLines = (newText||'').split('\n').filter(Boolean);
  var result = [];
  var maxLen = Math.max(oldLines.length, newLines.length);
  for(var i=0; i<maxLen; i++){
    var oldLine = oldLines[i]||'';
    var newLine = newLines[i]||'';
    if(oldLine === newLine){
      result.push(escHtml(newLine));
    } else if(newLine){
      result.push('<span class="diff-changed">'+escHtml(newLine)+'</span>');
    }
  }
  return result.join('<br>');
}

var OPTIMIZED_DRAFT_KEY = 'drama_drafts';

      subCat: d.state.subCat,
      style: d.state.style,
      theme: d.state.theme,
      episodes: d.state.episodes,
      characters: data.characters,
      outline: data.outline,
      episodes_data: data.episodes,
      shots_data: data.shots,
      comments: []
    };
    addScript(entry);

    // 发布成功，从草稿箱移除
    drafts.splice(idx, 1);
    saveDraftsToStorage(drafts);
    loadDrafts();
    toast('🎉 剧本「'+d.title+'」已发布！', 'success');
  }catch(e){
    toast('❌ 发布失败：'+e.message, true);
    if(btn) { btn.disabled = false; btn.innerHTML = '📤 发布'; }
  }
}

// ══════════════════════════════════════════════════════════
// 数据导入导出
// ══════════════════════════════════════════════════════════
function showDataModal(){
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'data-modal';
  var drafts = getDrafts();
  var scripts = getAllScripts();
  overlay.innerHTML = '<div class="modal-box">' +
    '<h2>💾 数据管理</h2>' +
    '<p style="color:#6a7090;font-size:.82rem;margin-bottom:1rem">所有数据保存在浏览器本地存储中</p>' +
    '<div style="background:#0b0e14;border-radius:8px;padding:.8rem;margin-bottom:1rem">' +
      '<div style="color:#aab0d0;font-size:.85rem">📁 作品集：'+scripts.length+' 个剧本</div>' +
      '<div style="color:#aab0d0;font-size:.85rem;margin-top:.3rem">📋 草稿箱：'+drafts.length+' 个草稿</div>' +
    '</div>' +
    '<div class="flex" style="gap:.5rem">' +
      '<button class="btn btn-primary btn-sm" onclick="exportData()">📤 导出数据</button>' +
      '<button class="btn btn-secondary btn-sm" onclick="importData()">📥 导入数据</button>' +
    '</div>' +
    '<div id="import-status" style="margin-top:.5rem;font-size:.82rem"></div>' +
    '<input type="file" id="import-file" accept=".json" style="display:none" onchange="handleImport(this)">' +
    '<div class="modal-actions"><button class="btn btn-secondary btn-sm" onclick="document.getElementById(\'data-modal\').remove()">关闭</button></div>' +
  '</div>';
  document.body.appendChild(overlay);
}

function exportData(){
  var data = {
    exportedAt: new Date().toISOString(),
    scripts: getAllScripts(),
    drafts: getDrafts()
  };
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'AI短剧数据_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('📤 数据已导出');
  document.getElementById('data-modal').remove();
}

function importData(){
  document.getElementById('import-file').click();
}

function handleImport(input){
  var status = document.getElementById('import-status');
  if(!input.files || !input.files[0]) return;
  var file = input.files[0];
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var data = JSON.parse(e.target.result);
      if(!data || !data.scripts) throw new Error('数据格式不正确');
      // 合并作品集
      var existing = getAllScripts();
      var existingIds = {};
      existing.forEach(function(s){ existingIds[s.id]=true; });
      var imported = 0;
      (data.scripts||[]).forEach(function(s){
        if(!existingIds[s.id]){
          existingIds[s.id]=true;
          existing.push(s);
          imported++;
        }
      });
      saveAllScripts(existing);
      // 合并草稿箱
      var drafts = getDrafts();
      var draftIds = {};
      drafts.forEach(function(d){ draftIds[d.id]=true; });
      var draftImported = 0;
      (data.drafts||[]).forEach(function(d){
        if(!draftIds[d.id]){
          draftIds[d.id]=true;
          drafts.push(d);
          draftImported++;
        }
      });
      saveDraftsToStorage(drafts);
      updateDraftBadge();
      status.innerHTML = '<span style="color:#00cec9">✅ 导入完成：'+imported+' 个剧本，'+draftImported+' 个草稿</span>';
      toast('📥 导入成功！', 'success');
      setTimeout(function(){ document.getElementById('data-modal').remove(); }, 2000);
    }catch(err){
      status.innerHTML = '<span style="color:#e74c3c">❌ 导入失败：'+escHtml(err.message)+'</span>';
    }
  };
  reader.readAsText(file);
  input.value = '';
}

// ══════════════════════════════════════════════════════════
// 工具
// ══════════════════════════════════════════════════════════
function escHtml(s){
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toast(msg, isError){
  const t = document.createElement('div');
  t.className = 'toast' + (isError==='success'?' success':isError?' error':'');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3000);
}

loadUsername();
render();
loadGallery();
</script>
