  * { margin:0; padding:0; box-sizing:border-box; }
  body {

  }
  .container { text-align: center; width: 100%; max-width: 680px; padding: 2rem; }
  h1 { color: #f1f5f9; font-size: 2.0rem; font-weight: 600; margin-bottom: 0.3rem; letter-spacing: 0.02em; }

  .back-row { text-align: left; margin-bottom: 1.2rem; }
  .back-btn {

  }
  .back-btn:hover { color: #e2e8f0; transform: translateX(-4px); }
  .list-grid { display: flex; flex-direction: column; gap: 0.8rem; }
  .list-item {
    display: flex; align-items: center; gap: 0.8rem;
    background: rgba(30,41,59,0.7); backdrop-filter: blur(6px);
    border: 1px solid #334155; border-radius: 12px;
    padding: 0.8rem 1.2rem; cursor: pointer;
    transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    text-align: left; position: relative; overflow: hidden;
  }
  .list-item:hover {
    border-color: #e11d48; background: rgba(30,41,59,0.9);
    transform: translateY(-2px); box-shadow: 0 6px 24px rgba(225,29,72,0.12);

  .list-item.expanding {

    box-shadow: 0 0 0 3px rgba(225,29,72,0.25), 0 10px 32px rgba(225,29,72,0.2);

  .item-avatar { width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; object-fit: cover; border: 2px solid rgba(255,255,255,0.15); }

  .list-item .item-name { color: #f1f5f9; font-size: 1.05rem; font-weight: 500; }
  .list-item .item-team { color: #64748b; font-size: 0.78rem; margin-top: 0.1rem; }
  .list-item .item-arrow { color: #475569; font-size: 0.9rem; transition: transform 0.3s; }
  .list-item:hover .item-arrow { transform: translateX(4px); color: #e11d48; }

  .detail-header { display: flex; align-items: center; gap: 1.2rem; text-align: left; margin-bottom: 2rem; }
  .detail-header .big-avatar { width: 72px; height: 72px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.2); }
  .detail-header .detail-title { flex: 1; }
  .detail-header .detail-title .name { color: #f1f5f9; font-size: 1.6rem; font-weight: 600; }
  .detail-header .detail-title .team { color: #94a3b8; font-size: 0.85rem; margin-top: 0.2rem; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; margin-bottom: 1.5rem; }
  .detail-card { background: rgba(30,41,59,0.7); backdrop-filter: blur(6px); border: 1px solid #334155; border-radius: 12px; padding: 0.9rem 1.1rem; text-align: left; }
  .detail-card.full { grid-column: 1 / -1; }
  .detail-card .label { color: #64748b; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.3rem; }
  .detail-card .value { color: #f1f5f9; font-size: 1.0rem; font-weight: 500; }
  .detail-card .value.highlight { color: #e11d48; }
  .bio-card { background: rgba(30,41,59,0.5); border: 1px solid #334155; border-radius: 12px; padding: 1.2rem 1.4rem; text-align: left; }
    .bio-card .bio-text { color: #cbd5e1; font-size: 0.9rem; line-height: 1.7; }
  .bio-card .stat-line { color: #64748b; font-size: 0.78rem; margin-top: 0.5rem; text-align: right; }
  /* 赛道详情双栏布局 */
  .circuit-bottom { display: flex; gap: 1rem; align-items: stretch; margin-bottom: 0.5rem; }
  .circuit-bio {
    flex: 1; background: rgba(30,41,59,0.5); border: 1px solid #334155;
    border-radius: 12px; padding: 1rem 1.2rem; text-align: left;
    display: flex; align-items: center;
  }
  .circuit-bio .bio-text { color: #cbd5e1; font-size: 0.9rem; line-height: 1.7; }
  .circuit-map {

    border-radius: 12px; padding: 0.5rem;
    display: flex; align-items: center; justify-content: center;
  }
  @media (max-width: 560px) {
    .circuit-bottom { flex-direction: column; }
    .circuit-map { width: 100%; }
  }
